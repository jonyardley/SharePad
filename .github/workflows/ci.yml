name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref — saves macOS minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint, Build & Test
    runs-on: macos-26 # pinned to match local: arm64 + Xcode 26.x → Swift 6
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Keyed on project.yml; SPM re-resolves over a stale cache, so a moved pin
      # stays correct (a same-range `from:` bump won't change the key — the cache
      # just lags until project.yml next changes, never shipping the wrong version).
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # swiftlint isn't on the macos-26 arm64 image (actions/runner-images#10595); swiftformat is.
      - name: Install tools
        run: brew install xcodegen just swiftlint

      # The image's preinstalled swiftformat version drifts (some runners ship
      # <0.62 which lacks wrapIfStatementBodies, others >=0.62 which enforces it
      # by default), reddening `just lint` non-deterministically. Pin to the
      # version developers run locally so the ruleset is stable — bump this and
      # local together, deliberately, the same way the runner image is pinned.
      - name: Pin SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.62.1
        run: |
          curl -fsSL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -oq /tmp/swiftformat.zip -d /tmp/swiftformat-bin
          sudo mv /tmp/swiftformat-bin/swiftformat "$(brew --prefix)/bin/swiftformat"
          swiftformat --version

      - name: Lint
        run: just lint

      # `just test` compiles the app + test bundle and runs the suite, so it
      # subsumes `just build` — one compile pass keeps macOS minutes down.
      - name: Build & test
        run: just test

      - name: Coverage summary
        run: just coverage

      # Guard the load-bearing entitlement/plist invariants (camera-only, no mic,
      # un-sandboxed) on the built app — a regression otherwise surfaces only live.
      - name: Verify app invariants
        run: just verify-app

  site:
    name: Site templates in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # docs/ is generated from site/ templates + site/site.config.json. Fail if a
      # committed docs/ page drifts from a fresh render (a hand-edit or stale build).
      # Stage first so a newly rendered but uncommitted page (untracked) is caught too;
      # plain `git diff` ignores untracked files.
      - name: Render and check for drift
        run: |
          node scripts/build-site.mjs
          git add -A docs/
          git diff --cached --exit-code docs/ || {
            echo "::error::docs/ is out of sync with site/ templates. Run 'just build-site' and commit."
            exit 1
          }
