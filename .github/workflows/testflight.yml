name: TestFlight (iPad)

# Archive the iPad app and upload it to TestFlight. Manual only.
# See specs/distribution.md §12.
on:
  # HACK(#183): first-run test from the branch; removed before ready.
  push:
    branches: [ci/testflight]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank: a UTC timestamp, as just pad-archive picks)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  SHAREPAD_TEAM_ID: 9S5FG4LQAF

jobs:
  testflight:
    name: Archive & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install tools
        run: brew install xcodegen just

      # The archive is development-signed and needs that identity's private key on
      # the runner; Xcode cannot mint one per run (Apple forums 695759). The export
      # then cloud-signs for distribution through the API key, which needs Admin.
      - name: Import development signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.PAD_DEV_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.PAD_DEV_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"

      - name: Archive & upload
        env:
          ASC_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/ac_api_key.p8
          PAD_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [ -n "$PAD_BUILD_NUMBER" ] || unset PAD_BUILD_NUMBER
          just pad-upload

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sharepad-ipad-archive
          path: .build/pad/SharePadPad.xcarchive
          retention-days: 14
          if-no-files-found: ignore
