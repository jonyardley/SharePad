name: TestFlight (iPad)

# Archive the iPad app and upload it to TestFlight. Manual only.
# See specs/distribution.md §12.
on:
  # HACK(#183): first-run test from the branch; removed before ready.
  push:
    branches: [ci/testflight]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank: a UTC timestamp, as just pad-archive picks)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  SHAREPAD_TEAM_ID: 9S5FG4LQAF

jobs:
  testflight:
    name: Archive & upload to TestFlight
    # Jon's M4, not a rented runner: those carry Xcode 26 at most, and an Xcode 26
    # build crashes on iPadOS 27 at the first pinch (#183). Setup in
    # specs/distribution.md §12.
    runs-on: [self-hosted, macOS, ARM64, sharepad-m4]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Require Xcode 27 or newer
        run: |
          set -euo pipefail
          have=$(xcodebuild -version)
          have=${have%%$'\n'*}
          major=$(echo "$have" | sed -E 's/^Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 27 ]; then
            echo "::error::runner is on $have; an upload needs Xcode 27 or newer, since an Xcode 26 build crashes on iPadOS 27 (#183)" >&2
            exit 1
          fi
          echo "$have"

      # The archive is development-signed and needs that identity's private key on
      # the runner; Xcode cannot mint one per run (Apple forums 695759). The export
      # then cloud-signs for distribution through the API key, which needs Admin.
      - name: Import development signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.PAD_DEV_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.PAD_DEV_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"

      - name: Archive & upload
        env:
          ASC_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/ac_api_key.p8
          PAD_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [ -n "$PAD_BUILD_NUMBER" ] || unset PAD_BUILD_NUMBER
          # The M4's login keychain holds its own Apple Development identity, which
          # Xcode prefers and the job cannot unlock (errSecInternalComponent), so
          # only the job's keychain is searched while signing.
          saved=$(security list-keychains -d user | tr -d '"')
          trap 'security list-keychains -d user -s $saved' EXIT
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          just pad-upload

      # The M4 keeps its disk between runs, so nothing signing-related may outlive the job.
      - name: Remove signing keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ac_api_key.p8" "$RUNNER_TEMP/cert.p12"

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sharepad-ipad-archive
          path: .build/pad/SharePadPad.xcarchive
          retention-days: 14
          if-no-files-found: ignore
